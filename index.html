<script>
const W1={1:["a","first","good","had","he","I","my","was"],2:["and","find","for","just","many","one","she","then"],3:["are","buy","little","said","too","up","will","you"],4:["do","live","of","our","wants","what","with","your"],5:["about","eat","how","make","out","put","takes","who"],6:["by","call","could","know","some","there","were","would"],7:["be","here","me","play","started","today","use","very"],8:["jump","right","say","their","walk","way","where","why"],9:["after","before","does","don't","grow","into","no","wash"],10:["around","came","come","found","other","people","two","worked"],11:["again","away","because","cold","fall","full","or","pretty"],12:["any","done","laugh","long","more","pull","teacher","think"],13:["another","gave","house","over","own","read","water","white"],14:["always","began","better","gives","hurt","shall","should","things"],15:["carry","draw","eight","even","goes","may","seven","shows"],16:["animal","heads","keep","let's","point","something","voice","won't"],17:["below","far","hear","hold","old","only","open","round"],18:["air","different","drink","enough","never","small","through","under"],19:["along","answer","children","going","mother","talk","upon","woman"],20:["bring","eyes","family","girl","move","soon","together","warm"],21:["brown","few","funny","myself","new","once","thank","words"],22:["almost","also","between","ever","food","really","sing","three"],23:["boy","door","father","maybe","nearest","says","shouted","until"]};

const WK={1:["to","by","my","am","at","go","man","no","is","the","a","see","I"],2:["can","and","you","an","it","has","ran","he","she","did","in","put","sits","me","with","big","good","his","very","got","on","here","of"],3:["lot","not","are","was","had","be","do","ten","but","up","look","want","him","us","for","her","yes","help","too","they","six","have","some","we","get","hot","where","or","if","stop","come","from","red","as","that","our"],4:["cut","must","said","when","off","will","down","so","back","let","were","what","then","this","could","now","tell","well","your","who","home","like","many","right","keep","made","why","would","make","time","all","into","came","gave","about","one"]};

// 2nd grade: lists 1-10 = teacher's "100 High Frequency Sight Words" card, split into 10 lists of 10 in card order.
// List 11+ = HMH weekly high-frequency words as complete sets, labeled by HMH week via W2_LABELS.
// Overlap with the card (e.g. does/see) is fine — getWords() dedupes.
const W2={1:["a","is","on","the","an","in","was","are","and","I"],2:["make","by","down","too","who","can","no","there","where","with"],3:["does","for","he","what","yes","have","puts","said","she","to"],4:["get","so","wants","pulls","after","first","new","old","put","were"],5:["her","laugh","my","of","out","will","would","work","you","do"],6:["here","one","start","be","like","from","good","made","went","play"],7:["five","four","three","two","into","see","think","both","wish","sees"],8:["asked","away","how","me","your","ride","they","want","we","white"],9:["little","now","been","could","live","very","worked","over","any","wanted"],10:["way","many","around","eating","look","saw","some","together","being","give"],11:["best","does","end","job","left","men","more","see","than","wash"],12:["do","give","he","line","said","set","seven","sure","upon","walk"],13:["close","cold","come","done","fire","front","life","name","small","time"]};

// 2nd grade weekly spelling words from HMH modules, keyed by HMH week number

// Phonics focus per SP2 week: pattern groups for Pattern Sort, short->long pairs for Magic E (VCe weeks only)
const PHONICS2={
1:{sort:{"short a (sad)":["sad","jam","glad","flat"],"short i (bit)":["bit","list","win","if","fix","rip"]}},
2:{sort:{"short e (yes)":["yes","rest","left","melt"],"short o (job)":["job","frog"],"short u (hug)":["hug","hum","plum","shut"]}},
3:{sort:{"a_e (cake)":["cake","plate","ate","grape","race"],"i_e (mine)":["mine","size","prize","wipe","line"]},magic:[["cap","cape"],["tap","tape"],["can","cane"],["mad","made"],["pin","pine"],["kit","kite"],["rip","ripe"],["hid","hide"]]},
4:{sort:{"o_e (rode)":["doze","nose","rose","pole","close","woke","rode","role"],"u_e (June)":["use","June","rule","tune"]},magic:[["rod","rode"],["hop","hope"],["not","note"],["rob","robe"],["cub","cube"],["tub","tube"],["us","use"],["cut","cute"]]}};

// One sentence per word: read in Read to Me, blanked in Fill the Gap, spoken in Paper Test dictation.

const SENT={"a":"I have a red ball.","about":"Tell me about your day.","after":"We play after lunch.","again":"Can we read it again?","air":"The balloon went up in the air.","all":"We all like pizza.","almost":"It is almost time for bed.","along":"The dog walks along the path.","also":"I also like to swim.","always":"I always brush my teeth.","am":"I am so happy today.","an":"I ate an apple.","and":"Mom and Dad came home.","animal":"A cat is my favorite animal.","another":"May I have another cookie?","answer":"Raise your hand to answer.","any":"Do you have any snacks?","are":"We are going to the park.","around":"The dog ran around the tree.","as":"We sang as we walked.","asked":"She asked for a glass of milk.","at":"Look at the big dog.","ate":"We ate pizza for dinner.","away":"The bird flew away.","back":"Come back soon!","be":"I want to be a doctor.","because":"I wore a coat because it was cold.","been":"I have been to the zoo.","before":"Wash your hands before you eat.","began":"The rain began to fall.","being":"Thank you for being kind.","below":"The fish swim below the boat.","best":"You are my best friend.","better":"My cold is better today.","between":"I sit between Mom and Dad.","big":"The elephant is very big.","bit":"The dog bit the bone.","both":"We both like to sing.","boy":"The boy kicked the ball.","bring":"Please bring your book.","brown":"The bear is brown.","but":"I like cats, but I love dogs.","buy":"We buy milk at the store.","by":"Sit by me.","cake":"We ate cake at the party.","call":"Call me on the phone.","came":"My friend came to play.","can":"I can ride a bike.","carry":"Can you carry this box?","children":"The children play outside.","close":"Please close the door.","cold":"The snow is cold.","come":"Come to my house.","could":"I could see the moon.","cut":"Mom cut the apple.","did":"I did my homework.","different":"Each leaf is different.","do":"What do you want to eat?","does":"Does your dog like to swim?","don't":"I don't like the rain.","done":"I am done with my snack.","door":"Knock on the door.","down":"The ball rolled down the hill.","doze":"Grandpa likes to doze in his chair.","draw":"I like to draw pictures.","drink":"I drink water every day.","eat":"We eat lunch at noon.","eating":"The cat is eating its food.","eight":"A spider has eight legs.","end":"That is the end of the story.","enough":"Do we have enough cups?","even":"He can even jump rope.","ever":"Have you ever seen a whale?","eyes":"My cat has green eyes.","fall":"Leaves fall from the trees.","family":"My family eats dinner together.","far":"The moon is far away.","father":"My father reads to me.","few":"I have a few coins.","find":"Can you find my shoe?","fire":"The fire is warm.","first":"I was first in line.","five":"A starfish has five arms.","fix":"Dad can fix the bike.","flat":"The tire is flat.","food":"The dog wants food.","for":"This gift is for you.","found":"I found my lost sock.","four":"A dog has four legs.","frog":"The frog jumped in the pond.","from":"I got a letter from Grandma.","front":"Stand in front of the class.","full":"My cup is full.","funny":"The clown is funny.","gave":"She gave me a hug.","get":"Did you get my note?","girl":"The girl rode her bike.","give":"Give the dog a bone.","gives":"Mom gives me a kiss.","glad":"I am glad you are here.","go":"We go to the park.","goes":"The bus goes to school.","going":"We are going on a trip.","good":"This soup is good.","got":"I got a new book.","grape":"I ate a green grape.","grow":"Plants grow in the sun.","had":"I had fun at the park.","has":"She has a pet fish.","have":"I have two cats.","he":"He is my brother.","heads":"The kids nod their heads.","hear":"I hear a bird singing.","help":"Can you help me?","her":"I like her hat.","here":"Come here, puppy!","him":"I gave him a toy.","his":"That is his bike.","hold":"Hold my hand.","home":"It is time to go home.","hot":"The soup is hot.","house":"My house is blue.","how":"How old are you?","hug":"Give me a big hug.","hum":"I like to hum a song.","hurt":"I hurt my knee.","I":"I like to play.","if":"Ask me if you need help.","in":"The cat is in the box.","into":"The frog jumped into the pond.","is":"The sky is blue.","it":"Throw it to me.","jam":"I like jam on my toast.","job":"My job is to feed the dog.","jump":"I can jump high.","June":"School ends in June.","just":"I just woke up.","keep":"You can keep the book.","know":"I know how to swim.","laugh":"Jokes make me laugh.","left":"Turn left at the corner.","let":"Let me see.","let's":"Let's play a game.","life":"Fish live their whole life in water.","like":"I like to swim.","line":"Stand in a line.","list":"Mom made a shopping list.","little":"The kitten is little.","live":"We live in a house.","long":"The snake is long.","look":"Look at the stars!","lot":"I ate a lot of pie.","made":"We made a cake.","make":"We make a fort.","man":"The man has a hat.","many":"How many dogs do you see?","may":"May I have a drink?","maybe":"Maybe it will snow.","me":"Play with me.","melt":"The ice will melt in the sun.","men":"Two men fixed the road.","mine":"That toy is mine.","more":"Can I have more milk?","mother":"My mother sings to me.","move":"Do not move!","must":"We must be quiet.","my":"This is my dog.","myself":"I did it myself!","name":"My name is on my paper.","nearest":"Go to the nearest door.","never":"I never eat bugs.","new":"I have new shoes.","no":"No, thank you.","nose":"My dog has a wet nose.","not":"I am not tired.","now":"Clean your room now.","of":"I drank a glass of milk.","off":"Turn off the light.","old":"My grandpa is old.","on":"The cat sat on the mat.","once":"Once there was a king.","one":"I have one sister.","only":"I have only one shoe.","open":"Open the box.","or":"Do you want milk or juice?","other":"Where is my other sock?","our":"This is our house.","out":"The dog wants to go out.","over":"The cow jumped over the moon.","own":"I have my own room.","people":"Many people came to the show.","plate":"Put the food on the plate.","play":"Kids play tag at recess.","plum":"The plum is purple.","point":"Point to the red one.","pole":"The flag is on a tall pole.","pretty":"The flower is pretty.","prize":"I won a prize!","pull":"Pull the wagon.","pulls":"The horse pulls the cart.","put":"Put the toys away.","puts":"He puts on his shoes.","race":"We race to the tree.","ran":"The dog ran fast.","read":"I love to read books.","really":"I really like ice cream.","red":"The apple is red.","rest":"I need to rest.","ride":"I ride the bus to school.","right":"Raise your right hand.","rip":"Do not rip the paper.","rode":"She rode her bike to school.","role":"I had a big role in the play.","rose":"The rose smells sweet.","round":"A ball is round.","rule":"Follow the rule.","sad":"The puppy looks sad.","said":"Mom said yes!","saw":"I saw a rainbow.","say":"What did you say?","says":"My teacher says hello.","see":"I see a bird.","sees":"The cat sees a mouse.","set":"Help me set the table.","seven":"There are seven days in a week.","shall":"Shall we go outside?","she":"She is my sister.","should":"You should wear a coat.","shouted":"The boy shouted for help.","shows":"The map shows the way.","shut":"Shut the door, please.","sing":"We sing a song.","sits":"The cat sits on my lap.","six":"A bug has six legs.","size":"What size are your shoes?","small":"A mouse is small.","so":"I am so happy!","some":"Can I have some juice?","something":"I see something in the tree.","soon":"We will eat soon.","start":"Time to start the game.","started":"It started to rain.","stop":"Stop at the red light.","sure":"Are you sure?","takes":"She takes the bus.","talk":"We talk at lunch.","teacher":"My teacher is nice.","tell":"Tell me a story.","ten":"I can count to ten.","than":"A dog is bigger than a cat.","thank":"I thank my mom for dinner.","that":"Look at that bird!","the":"The sun is hot.","their":"The kids got their coats.","then":"Eat, then play.","there":"Put it over there.","they":"They are my friends.","things":"I put my things away.","think":"I think it will rain.","this":"This is fun!","three":"I have three fish.","through":"We walked through the woods.","time":"What time is it?","to":"I go to school.","today":"It is sunny today.","together":"We play together.","too":"I want to come too!","tune":"Hum a happy tune.","two":"I have two hands.","under":"The cat is under the bed.","until":"Wait until I get there.","up":"Look up at the sky.","upon":"The cat sat upon the wall.","us":"Come with us.","use":"Use a pencil to write.","very":"I am very happy.","voice":"Use a quiet voice.","walk":"We walk to the park.","want":"I want a snack.","wanted":"I wanted to play.","wants":"The baby wants her bottle.","warm":"The blanket is warm.","was":"It was a sunny day.","wash":"Wash your hands.","water":"Fish live in water.","way":"Which way do we go?","we":"We like to dance.","well":"I feel well today.","went":"We went to the beach.","were":"We were at the zoo.","what":"What is your name?","when":"When is lunch?","where":"Where is my hat?","white":"Snow is white.","who":"Who is at the door?","why":"Why is the sky blue?","will":"I will help you.","win":"I hope we win!","wipe":"Wipe your feet.","wish":"I wish I could fly.","with":"Come with me.","woke":"I woke up early.","woman":"The woman has a red hat.","won't":"The car won't start.","words":"I can read these words.","work":"Dad goes to work.","worked":"We worked hard.","would":"Would you like a cookie?","yes":"Yes, I can do it!","you":"I love you.","your":"Is this your coat?"};
// Whole-word match that keeps apostrophes inside words (don't, let's)
const wordRe=w=>new RegExp("(^|[^A-Za-z'])("+w+")(?![A-Za-z'])","i");

let currentGrade='2';
let wordMode='sight';
let W=W2;

// ===== KIDS & PROGRESS (saved on this device) =====
// Spaced review: a word in box n comes back after IV[n] days; a miss drops it to box 0.
// Recognition games (pick the word you heard) only lift a word to box 2; reaching KNOWN needs reading or spelling it unprompted.
const IV=[0,1,2,4,7,14],KNOWN=3,STORE='sws.v1';
const dayNum=()=>{const d=new Date();return Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);};
const KIDS={savvy:{name:'Savvy',emoji:'👧',grade:'2'},logan:{name:'Logan',emoji:'👦',grade:'K'}};
const DB=(()=>{try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&d.kids)return d;}catch(e){}return{kids:{},voice:''};})();
for(const[id,k]of Object.entries(KIDS))DB.kids[id]=Object.assign({...k,mode:'sight',sel:{},words:{},days:[]},DB.kids[id]);
function save(){try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){}}
let P=null,recorded=new Set(),custom=null,lastWords=null;

function status(w){const s=P&&P.words[w];return!s?'new':s.b>=KNOWN?'known':s.m?'tricky':'learning';}
// Only the first answer per word per game counts, so retries and re-queues don't inflate progress
function rec(w,ok,recall){if(!P||recorded.has(w))return;recorded.add(w);const s=P.words[w]||(P.words[w]={b:0,d:0,c:0,m:0});if(ok){s.c++;if(recall||s.b<2)s.b=Math.min(s.b+1,IV.length-1);}else{s.m++;s.b=0;}s.d=dayNum()+IV[s.b];save();}
function markDay(){if(!P)return;const t=dayNum();if(!P.days.includes(t)){P.days=[...P.days,t].slice(-400);save();}}
function streak(){const s=new Set(P.days);let t=dayNum(),n=0;if(!s.has(t))t--;while(s.has(t)){n++;t--;}return n;}
function allWords(){return[...new Set(Object.values(W).flat())];}
function trickyWords(){return allWords().filter(w=>status(w)==='tricky').sort((a,b)=>P.words[b].m-P.words[a].m).slice(0,12);}

// Incremental rehearsal: each not-yet-known word from the current lists sits between two easier ones,
// plus older words whose review day has come
function todaysWords(){
  const t=dayNum(),cur=weekWords(),rank={tricky:0,learning:1,new:2};
  const focus=cur.filter(w=>status(w)!=='known').sort((a,b)=>rank[status(a)]-rank[status(b)]).slice(0,4);
  const due=allWords().filter(w=>!focus.includes(w)&&P.words[w]&&P.words[w].d<=t).sort((a,b)=>P.words[a].b-P.words[b].b).slice(0,4);
  const easy=shuffle(allWords().filter(w=>status(w)==='known'&&!due.includes(w))).slice(0,Math.max(0,12-focus.length-due.length));
  const rest=shuffle([...due,...easy]),out=[];
  focus.forEach(w=>out.push(w,...rest.splice(0,2)));
  const words=[...out,...rest];
  // First sessions have nothing known or due yet, so pad with the current lists
  for(const w of shuffle(cur))if(words.length<8&&!words.includes(w))words.push(w);
  return words;
}

}
function b4a(id){const l=bl.l.find(x=>x.id===id);if(!l)return;bl.a.push(l);bl.l=bl.l.filter(x=>x.id!==id);r4();const w=bl.w[bl.i];if(bl.a.length===w.length){if(bl.a.map(x=>x.c).join('')===w){rec(w,true);bl.s++;document.getElementById('b4F').innerHTML='<span style="color:#2ecc71">🎉 Perfect!</span>';speak("Awesome!");setTimeout(()=>{if(bl.i+1>=bl.w.length)finish(bl.s);else{bl.i++;s4();}},1200);}else{rec(w,false);document.getElementById('b4F').innerHTML='<span style="color:#e74c3c">Oops! Try again! 💪</span>';setTimeout(s4,1000);}}}

function g5(){const pool=shuffle(gameWords).slice(0,16);bg={words:shuffle([...pool]),grid:shuffle([...pool]),found:[],cur:null};showScreen('gameScreen');b5n();}
function b5n(){if(bg.words.length===0||bg.found.length===bg.grid.length){finish(bg.found.length);return;}bg.cur=bg.words.pop();speak(bg.cur);r5();}
function r5(){
  G.innerHTML=`<p style="font-size:16px;color:#7f8c8d;margin-bottom:8px">Find the word you hear!</p>${progress(bg.found.length,bg.grid.length)}<button class="btn" style="background:#45B7D1;margin:12px 0" onclick="speak('${esc(bg.cur||'')}')">🔊 Hear Again</button><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:360px;margin:16px auto">${bg.grid.map((w,i)=>{const f=bg.found.includes(w);return`<div onclick="b5t(${i})" style="display:flex;align-items:center;justify-content:center;min-height:52px;padding:4px;font-size:16px;font-weight:600;border-radius:12px;cursor:pointer;background:${f?'#d5f5e3':'#fff'};border:2px solid ${f?'#2ecc71':'#dfe6e9'};color:${f?'#2ecc71':'#2d3436'};opacity:${f?.7:1};transition:all .2s">${w}${f?' ✓':''}</div>`;}).join('')}</div><p id="b5F" style="font-size:20px;margin-top:12px"></p>`;

// ===== 7. MISSING LETTER =====
let ms;
function g7(){ms={i:0,s:0,w:shuffle(gameWords.filter(w=>w.length>=3)).slice(0,15),ans:''};r7();}
function r7(){
  const w=ms.w[ms.i],pos=1+Math.floor(Math.random()*(w.length-1));ms.ans=w[pos];ms.pos=pos;
  const display=w.split('').map((c,i)=>i===pos?'_':c).join('');
  const wrong='abcdefghijklmnopqrstuvwxyz'.split('').filter(c=>c!==ms.ans);

}
function m7(c){rec(ms.w[ms.i],c===ms.ans);if(c===ms.ans){ms.s++;const w=ms.w[ms.i];const el=document.getElementById('m7W');el.innerHTML=w.split('').map((ch,i)=>i===ms.pos?'<span style="color:#2ecc71;text-decoration:underline">'+ch+'</span>':ch).join('');document.getElementById('m7C').innerHTML='';document.getElementById('m7F').innerHTML='<span style="color:#2ecc71">🎉 Correct!</span>';speak(w);setTimeout(()=>{if(ms.i+1>=ms.w.length)finish(ms.s);else{ms.i++;r7();}},1500);}else{document.getElementById('m7F').innerHTML='<span style="color:#e74c3c">Try another! 💪</span>';setTimeout(()=>{const e=document.getElementById('m7F');if(e)e.textContent='';},800);}}

// ===== 8. SPEED READ =====
let sd;
function g8(){
  const words=shuffle([...gameWords]).slice(0,15);
  sd={i:0,s:0,words,active:true};s8();}
function s8(){
  if(sd.i>=sd.words.length){finish(sd.s);return;}
  sd.active=true;
  const dur=Math.max(1.0, 2.5-sd.i*0.1);
  const w=sd.words[sd.i];
  G.innerHTML=`<p style="font-size:16px;color:#7f8c8d;margin-bottom:8px">Word ${sd.i+1} of ${sd.words.length}</p>${progress(sd.s,sd.words.length)}<p style="font-size:14px;color:#b2bec3;margin:8px 0">👀 Read it before it disappears!</p><div style="width:250px;height:12px;border-radius:8px;background:#e0e0e0;margin:12px auto;overflow:hidden"><div id="sdB" style="width:100%;height:100%;border-radius:8px;background:linear-gradient(90deg,#e74c3c,#f39c12,#2ecc71);transition:width .05s linear"></div></div><div style="margin:30px 0"><span style="font-size:52px;font-weight:700;color:#2d3436;animation:bounceIn .3s ease">${w}</span></div>`;
  const start=Date.now();if(activeTimer)clearInterval(activeTimer);
  activeTimer=setInterval(()=>{const rem=dur-(Date.now()-start)/1000;if(rem<=0){clearInterval(activeTimer);s8pick();}else{const b=document.getElementById('sdB');if(b)b.style.width=`${(rem/dur)*100}%`;}},50);
}
function s8pick(){
  const w=sd.words[sd.i];
  const wrong=shuffle(gameWords.filter(x=>x!==w)).slice(0,3);
  const choices=shuffle([w,...wrong]);
  G.innerHTML=`<p style="font-size:16px;color:#7f8c8d;margin-bottom:8px">Word ${sd.i+1} of ${sd.words.length}</p>${progress(sd.s,sd.words.length)}<p style="font-size:20px;color:#636e72;margin:20px 0">Which word did you see? 👀</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:320px;margin:20px auto">${choices.map(c=>`<button onclick="s8ans(this,'${c.replace(/'/g,"\\'")}')" style="padding:16px;border-radius:16px;border:3px solid #dfe6e9;background:#fff;font-size:22px;font-weight:600;color:#2d3436;cursor:pointer;font-family:'Fredoka',sans-serif;transition:all .2s">${c}</button>`).join('')}</div><p id="sdF" style="font-size:22px;margin-top:16px"></p>`;
}
function s8ans(btn,picked){

  if(picked===w){sd.s++;btn.style.background='#d5f5e3';btn.style.border='3px solid #2ecc71';document.getElementById('sdF').innerHTML='<span style="color:#2ecc71">⭐ You read it!</span>';speak(w);setTimeout(()=>{sd.i++;s8();},900);}
  else{btn.style.background='#fadbd8';btn.style.border='3px solid #e74c3c';document.getElementById('sdF').innerHTML='<span style="color:#e74c3c">It was \"'+w+'\"</span>';speak(w);setTimeout(()=>{sd.i++;s8();},1500);}
}

// ===== 10. WORD SORT =====
let ct;
function g10(){
  const av=getWords().map(w=>w.toLowerCase());
  const entries=Object.entries(CATEGORIES);let cats={},pool=[];
  for(const[n,ws]of entries){const m=ws.filter(w=>av.includes(w));if(m.length>=2){cats[n]=[];pool.push(...m.slice(0,4).map(w=>({w,cat:n})));}if(Object.keys(cats).length>=3)break;}
  if(Object.keys(cats).length<2){cats={"Action Words":[],"Describing Words":[]};pool=[{w:"jump",cat:"Action Words"},{w:"walk",cat:"Action Words"},{w:"play",cat:"Action Words"},{w:"good",cat:"Describing Words"},{w:"little",cat:"Describing Words"},{w:"pretty",cat:"Describing Words"}];}
  ct={s:0,cats,pool:shuffle(pool),placed:{},drag:null};Object.keys(ct.cats).forEach(c=>ct.placed[c]=[]);r10();}
function r10(){
  const cats=Object.keys(ct.cats),rem=ct.pool.filter(w=>!cats.some(c=>ct.placed[c].find(p=>p.w===w.w)));
  G.innerHTML=`<p style="font-size:18px;color:#636e72;margin:12px 0">Tap a word, then tap its group!</p>${progress(ct.s,ct.pool.length)}<div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0">${rem.map(w=>`<span onclick="c10s('${esc(w.w)}')" style="font-size:18px;padding:8px 14px;border-radius:12px;background:${ct.drag===w.w?'#ffeaa7':'linear-gradient(135deg,#667eea,#764ba2)'};color:${ct.drag===w.w?'#2d3436':'#fff'};font-weight:600;cursor:pointer">${w.w}</span>`).join('')}</div>${cats.map(c=>`<div onclick="c10d('${esc(c)}')" style="min-height:70px;border-radius:16px;padding:10px;margin:8px auto;max-width:380px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:${ct.drag?'#fff3cd':'#f8f9fa'};border:2px ${ct.drag?'dashed #f39c12':'solid #dfe6e9'};cursor:pointer"><p style="font-size:14px;font-weight:600;color:#636e72;width:100%;margin-bottom:4px">📦 ${c}</p>${ct.placed[c].map(w=>`<span style="font-size:16px;padding:4px 10px;border-radius:8px;background:#d5f5e3;color:#2d3436">${w.w} ✓</span>`).join('')}</div>`).join('')}<p id="c10F" style="font-size:20px;margin-top:12px"></p>`;
}
function c10s(w){ct.drag=ct.drag===w?null:w;if(ct.drag)speak(w);r10();}
function c10d(cat){
  if(!ct.drag)return;const wp=ct.pool.find(w=>w.w===ct.drag);if(!wp)return;
  if(wp.cat===cat){ct.placed[cat].push(wp);ct.s++;ct.drag=null;speak("Great!");
    const cats=Object.keys(ct.cats),rem=ct.pool.filter(w=>!cats.some(c=>ct.placed[c].find(p=>p.w===w.w)));
    if(rem.length===0){r10();setTimeout(()=>finish(ct.s),1000);}else r10();
  }else{ct.drag=null;r10();const e=document.getElementById('c10F');if(e)e.innerHTML='<span style="color:#e74c3c">Try another group! 🤔</span>';setTimeout(()=>{const e=document.getElementById('c10F');if(e)e.textContent='';},800);}
}

// ===== 11. WORD RACE =====
let wr;
function g11(){
  wr={i:0,s:0,w:shuffle([...gameWords]).slice(0,15),totalTime:0};
  G.innerHTML=`<div style="max-width:340px;margin:20px auto;text-align:center"><div style="font-size:60px;margin-bottom:16px">🏁</div><h2 style="font-size:24px;font-weight:700;color:#2d3436;margin-bottom:16px">Word Race</h2><p style="font-size:18px;color:#636e72;line-height:1.6;margin-bottom:24px">You'll hear a word.<br>Two words will show up.<br>Tap the right one as fast as you can!</p><button class="btn" style="background:#e84393;font-size:20px;padding:14px 32px" onclick="r11()">Ready, Set, Go! 🏁</button></div>`;
}
function r11(){
  if(wr.i>=wr.w.length){finish(wr.s);return;}
  const target=wr.w[wr.i];
  const decoy=shuffle(gameWords.filter(w=>w!==target))[0]||"the";
  const pair=shuffle([target,decoy]);
  wr.start=Date.now();
  speak(target);
  G.innerHTML=`<p style="font-size:16px;color:#7f8c8d;margin-bottom:8px">Word ${wr.i+1} of ${wr.w.length}</p>${progress(wr.s,wr.w.length)}<div style="font-size:48px;cursor:pointer;margin:16px 0" onclick="speak('${esc(target)}')">🔊</div><p style="font-size:18px;color:#636e72;margin:8px 0">Tap the word you heard!</p><div style="display:flex;gap:16px;justify-content:center;margin:24px 0">${pair.map(w=>`<button onclick="r11tap(this,'${esc(w)}','${esc(target)}')" style="padding:20px 32px;border-radius:20px;border:3px solid #dfe6e9;background:#fff;font-size:32px;font-weight:700;color:#2d3436;cursor:pointer;font-family:'Fredoka',sans-serif;min-width:130px;transition:all .2s">${w}</button>`).join('')}</div><p id="r11F" style="font-size:22px;margin-top:16px"></p>`;
}
function r11tap(btn,picked,target){

    wr.s++;wr.totalTime+=ms;
    btn.style.background='#d5f5e3';btn.style.border='3px solid #2ecc71';btn.style.transform='scale(1.1)';

    setTimeout(()=>{wr.i++;r11();},800);

    document.getElementById('r11F').innerHTML='<span style="color:#e74c3c">That\'s the other one! 👀</span>';
    speak(target);
    setTimeout(()=>{wr.i++;r11();},1500);

}

// ===== 12. POP THE WORD =====
let pw;
function g12(){
  pw={s:0,w:shuffle([...gameWords]).slice(0,15),i:0,bubbles:[],target:null,raf:null,done:false};
  G.innerHTML='<div style="max-width:340px;margin:20px auto;text-align:center"><div style="font-size:60px;margin-bottom:16px">🫧</div><h2 style="font-size:24px;font-weight:700;color:#2d3436;margin-bottom:16px">Pop the Word</h2><p style="font-size:18px;color:#636e72;line-height:1.6;margin-bottom:24px">Words float up like bubbles!<br>Listen for the word.<br>Tap it before it floats away!</p><button class="btn" style="background:#00b894;font-size:20px;padding:14px 32px" onclick="p12go()">Let\'s Pop! 🫧</button></div>';
}
function p12go(){
  if(pw.i>=pw.w.length){finish(pw.s);return;}
  pw.target=pw.w[pw.i];pw.done=false;
  const distractors=shuffle(gameWords.filter(w=>w!==pw.target)).slice(0,4);
  const allWords=shuffle([pw.target,...distractors]);
  const xSlots=shuffle([10,30,50,70,85]);
  pw.bubbles=allWords.map((w,i)=>({w,id:'b'+pw.i+'-'+i,x:xSlots[i],y:105+i*30,speed:0.25+Math.random()*0.15,wobble:Math.random()*Math.PI*2,popped:false}));
  speak(pw.target);
  // Build shell once
  G.innerHTML=`<p style="font-size:16px;color:#7f8c8d;margin-bottom:4px">Word ${pw.i+1} of ${pw.w.length}</p>${progress(pw.s,pw.w.length)}<button class="btn" style="background:#45B7D1;margin:8px 0" id="p12hear">🔊 Hear Again</button><div id="p12area" style="position:relative;width:100%;height:350px;overflow:hidden;border-radius:20px;background:linear-gradient(180deg,#e0f7ff,#f0e6ff);margin:8px 0"></div><p id="p12F" style="font-size:22px;margin-top:8px"></p>`;
  document.getElementById('p12hear').addEventListener('click',()=>speak(pw.target));
  // Create bubble elements
  const area=document.getElementById('p12area');
  pw.bubbles.forEach(b=>{
    const el=document.createElement('div');
    el.id=b.id;
    el.textContent=b.w;
    el.style.cssText='position:absolute;padding:12px 18px;border-radius:50px;background:rgba(255,255,255,0.92);border:3px solid #dfe6e9;font-size:20px;font-weight:600;color:#2d3436;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,0.1);white-space:nowrap;user-select:none;-webkit-user-select:none;z-index:10;';
    el.style.left=b.x+'%';el.style.top=b.y+'%';el.style.transform='translate(-50%,-50%)';
    el.addEventListener('pointerdown',function(e){e.preventDefault();p12tap(b.id);});
    area.appendChild(el);
  });
  if(pw.raf)cancelAnimationFrame(pw.raf);
  p12animate();
}
function p12animate(){
  if(pw.done)return;
  const active=pw.bubbles.filter(b=>!b.popped);
  let anyVisible=false;
  for(const b of active){
    b.y-=b.speed;b.wobble+=0.02;b.x+=Math.sin(b.wobble)*0.2;
    if(b.y>-10)anyVisible=true;
    const el=document.getElementById(b.id);
    if(el){el.style.left=b.x+'%';el.style.top=b.y+'%';}
  }
  if(!anyVisible){
    pw.done=true;cancelAnimationFrame(pw.raf);rec(pw.target,false);
    const f=document.getElementById('p12F');
    if(f)f.innerHTML='<span style="color:#e74c3c">⏰ Too slow! It was "'+pw.target+'"</span>';
    speak(pw.target);
    setTimeout(()=>{pw.i++;p12go();},1500);
    return;
  }
  pw.raf=requestAnimationFrame(p12animate);
}
function p12tap(id){
  if(pw.done)return;
  const b=pw.bubbles.find(x=>x.id===id);
  if(!b||b.popped)return;
  const el=document.getElementById(b.id);
  if(b.w===pw.target){
    pw.done=true;b.popped=true;rec(pw.target,true);
    cancelAnimationFrame(pw.raf);
    if(el){el.style.background='#d5f5e3';el.style.border='3px solid #2ecc71';el.style.transform='translate(-50%,-50%) scale(1.3)';}
    pw.s++;
    const f=document.getElementById('p12F');if(f)f.innerHTML='<span style="color:#2ecc71">🎉 Pop!</span>';
    speak(pw.target);
    setTimeout(()=>{pw.i++;p12go();},900);
  }else{
    b.popped=true;rec(pw.target,false);
    if(el){el.style.opacity='0';el.style.transform='translate(-50%,-50%) scale(0)';el.style.transition='all 0.3s';}
    const f=document.getElementById('p12F');if(f)f.innerHTML='<span style="color:#e74c3c">Not that one!</span>';
    setTimeout(()=>{const f=document.getElementById('p12F');if(f)f.textContent='';},600);
  }
}

let sy;
function g13(){sy={q:[...gameWords],i:0,s:0,again:new Set(),total:gameWords.length};
  intro('🗣️','Say It!','A word will pop up.<br>Read it out loud!<br><br><b>Grown-ups:</b> tap ✅ only if<br>they read it without help.','#d35400','r13()','Start Reading 🗣️');}

}
function y13(ok){
  const w=sy.q[sy.i];rec(w,ok,true);document.getElementById('syB').innerHTML='';
  if(ok){if(!sy.again.has(w))sy.s++;document.getElementById('syF').innerHTML='<span style="color:#2ecc71">⭐ Great reading!</span>';}
  else{speak(w);document.getElementById('syF').innerHTML=`It says <b>${w}</b>. Say it with me!`;
    // Missed words come back once, a few cards later, while still fresh
    if(!sy.again.has(w)){sy.again.add(w);sy.q.splice(Math.min(sy.i+4,sy.q.length),0,w);}}
  setTimeout(()=>{if(++sy.i>=sy.q.length)finish(sy.s);else r13();},ok?700:2200);
}

function g14(){pt={w:[...gameWords],i:0,miss:new Set()};
  intro('📝','Paper Test','Get a pencil and paper!<br>I will say each word and<br>use it in a sentence.<br>Write it down, then tap Next.','#2d3436','p14()','Ready! ✏️');}
function dictate(n){const w=pt.w[n-1];speak(`Number ${n}. ${w}. ${SENT[w]||''} ${w}.`,0.75);}
function p14(){
  const n=pt.i+1;
  G.innerHTML=`${hdr(pt.i,pt.w.length,pt.i)}<div style="font-size:80px;font-weight:700;color:#2d3436;margin:24px 0">#${n}</div><p style="font-size:18px;color:#636e72;margin-bottom:20px">Write word number ${n}! ✏️</p><div style="display:flex;gap:14px;justify-content:center"><button class="btn" style="background:#45B7D1;font-size:18px" onclick="dictate(${n})">🔊 Again</button><button class="btn" style="background:#2ecc71;font-size:18px" onclick="n14()">${n<pt.w.length?'Next ➡️':'Check ✅'}</button></div>`;
  dictate(n);
}
function n14(){if(++pt.i<pt.w.length)p14();else{speechSynthesis.cancel();k14();}}
function k14(){
  G.innerHTML=`<h2 style="font-size:24px;font-weight:700;color:#2d3436;margin:8px 0">Check your paper! 🔍</h2><p style="font-size:16px;color:#636e72;margin-bottom:16px">Grown-ups: tap each word that was spelled wrong.</p><div style="display:flex;flex-direction:column;gap:8px;max-width:320px;margin:0 auto">${pt.w.map((w,i)=>{const x=pt.miss.has(w);return`<button onclick="t14('${esc(w)}')" style="display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-radius:14px;border:3px solid ${x?'#e74c3c':'#2ecc71'};background:${x?'#fadbd8':'#d5f5e3'};font-family:'Fredoka',sans-serif;font-size:24px;font-weight:600;color:#2d3436;cursor:pointer"><span>${i+1}. ${w}</span><span>${x?'✗':'✓'}</span></button>`;}).join('')}</div><button class="btn" style="background:#667eea;font-size:20px;margin-top:20px" onclick="s14()">💾 Save</button>`;
}
function t14(w){pt.miss.has(w)?pt.miss.delete(w):pt.miss.add(w);k14();}
function s14(){pt.w.forEach(w=>rec(w,!pt.miss.has(w),true));finish(pt.w.length-pt.miss.size);}

// ===== 15. MAGIC E =====
let mg;
function g15(){mg={p:shuffle(phon('magic').flat()).slice(0,8),i:0,s:0,done:false};
  intro('🪄','Magic E','A silent e at the end<br>makes the vowel say its name!<br><br>rod ➜ rod<b style="color:#8e44ad">e</b>','#8e44ad','r15()','Make Magic! 🪄');}
function r15(){
  const[a]=mg.p[mg.i];mg.done=false;
  G.innerHTML=`${hdr(mg.i,mg.p.length,mg.s)}<div id="mgW" style="font-size:64px;font-weight:700;color:#2d3436;margin:30px 0">${a}</div><p id="mgT" style="font-size:18px;color:#636e72;margin-bottom:16px">This says <b>${a}</b>. Now add the magic e!</p><div id="mgB"><button class="btn" style="background:#8e44ad;font-size:22px" onclick="e15()">🪄 Add magic e</button></div>`;
  speak(a);
}
function e15(){const[a,b]=mg.p[mg.i];document.getElementById('mgW').innerHTML=`${a}<span style="color:#8e44ad">e</span>`;document.getElementById('mgT').innerHTML=`Now it says <b>${b}</b>!`;document.getElementById('mgB').innerHTML='';speak(b);setTimeout(q15,1800);}
function q15(){
  const pair=mg.p[mg.i];mg.t=pair[Math.random()<.5?0:1];
  G.innerHTML=`${hdr(mg.i,mg.p.length,mg.s)}<div style="font-size:48px;cursor:pointer;margin:16px 0" onclick="speak(mg.t)">🔊</div><p style="font-size:18px;color:#636e72">Which word did you hear?</p><div style="display:flex;gap:16px;justify-content:center;margin:24px 0">${shuffle(pair).map(w=>`<button onclick="a15(this,'${w}')" style="${BIG}">${w}</button>`).join('')}</div><p id="mgF" style="font-size:22px"></p>`;
  speak(mg.t);
}
function a15(btn,w){
  if(mg.done)return;mg.done=true;const ok=w===mg.t;if(ok)mg.s++;
  btn.style.background=ok?'#d5f5e3':'#fadbd8';btn.style.border=`3px solid ${ok?'#2ecc71':'#e74c3c'}`;
  document.getElementById('mgF').innerHTML=ok?'<span style="color:#2ecc71">🎉 Yes!</span>':`<span style="color:#e74c3c">It was ${mg.t}</span>`;
  speak(mg.t);setTimeout(()=>{if(++mg.i>=mg.p.length)finish(mg.s);else r15();},1400);
}

// ===== 16. PATTERN SORT (reuses Word Sort's board) =====
function g16(){
  const cats={},pool=[];
  phon('sort').forEach(g=>Object.entries(g).forEach(([c,ws])=>{cats[c]=[];ws.forEach(w=>pool.push({w,cat:c}));}));
  ct={s:0,cats,pool:shuffle(pool),placed:{},drag:null};Object.keys(cats).forEach(c=>ct.placed[c]=[]);r10();
}

// ===== 17. FILL THE GAP =====
let cz;
function g17(){cz={w:gameWords.filter(w=>SENT[w]).slice(0,10),i:0,s:0};r17();}
function r17(){
  const w=cz.w[cz.i];cz.done=false;cz.missed=false;
  const blank=SENT[w].replace(wordRe(w),'$1<span id="czB" style="display:inline-block;min-width:80px;border-bottom:4px solid #c0392b">&nbsp;</span>');
  // Prefer distractors from the same set so the choice is between words they're actually learning
  const others=[...shuffle(gameWords.filter(x=>x!==w)),...shuffle(allWords().filter(x=>x!==w&&!gameWords.includes(x)))].slice(0,2);
  G.innerHTML=`${hdr(cz.i,cz.w.length,cz.s)}<p style="font-size:18px;color:#636e72;margin:12px 0">Which word finishes the sentence?</p><div style="background:#fff;border-radius:20px;padding:24px;margin:16px auto;max-width:380px;box-shadow:0 8px 30px rgba(0,0,0,.08)"><p style="font-size:30px;font-weight:600;color:#2d3436;line-height:1.5">${blank}</p></div><div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 0">${shuffle([w,...others]).map(c=>`<button onclick="a17(this,'${esc(c)}')" style="${BIG}">${c}</button>`).join('')}</div><p id="czF" style="font-size:22px"></p>`;
}
function a17(btn,c){
  if(cz.done||btn.disabled)return;const w=cz.w[cz.i];rec(w,c===w);
  if(c===w){cz.done=true;if(!cz.missed)cz.s++;document.getElementById('czB').outerHTML=`<span style="color:#2ecc71;text-decoration:underline">${SENT[w].match(wordRe(w))[2]}</span>`;btn.style.background='#d5f5e3';btn.style.border='3px solid #2ecc71';document.getElementById('czF').innerHTML='<span style="color:#2ecc71">🎉 You got it!</span>';speak(SENT[w]);setTimeout(()=>{if(++cz.i>=cz.w.length)finish(cz.s);else r17();},2400);}
  else{cz.missed=true;btn.disabled=true;btn.style.background='#fadbd8';btn.style.border='3px solid #e74c3c';btn.style.opacity='.6';document.getElementById('czF').innerHTML='<span style="color:#e74c3c">Try another! 💪</span>';}
}

// INIT
showProfiles();
</script>
</body>
